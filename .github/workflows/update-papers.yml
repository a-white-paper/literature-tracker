# Automatically refresh papers.json with recent literature from OpenAlex.
#
# This workflow is the scheduled data pipeline for the website. It first runs
# the synthetic-organic literature fetch/filter stage, then enriches the
# accepted records with publisher-provided TOC / article-image metadata. The
# completed papers.json dataset is committed only when it actually changes.

name: Update literature

on:
  # GitHub Actions cron schedules use UTC. 00:00 UTC corresponds to 08:00 in
  # China Standard Time (UTC+8).
  schedule:
    - cron: "0 0 * * *"

  # Re-run immediately whenever either the literature filter or TOC-enrichment
  # logic changes. This makes code refinements visible on the website without
  # waiting for the next scheduled daily refresh.
  push:
    branches: ["main"]
    paths:
      - "scripts/fetch_papers.py"
      - "scripts/fetch_toc.py"
      - ".github/workflows/update-papers.yml"

  # Also allow the workflow to be started manually from the Actions tab.
  workflow_dispatch:

# The workflow needs write access because it may commit an updated papers.json
# back to the main branch.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # Download the current repository contents into the workflow runner.
      - name: Check out repository
        uses: actions/checkout@v4

      # Use a fixed Python version so scheduled runs are reproducible.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stage 1: query OpenAlex, apply the synthetic-organic admission and
      # materials-exclusion rules, normalize accepted papers, and deduplicate.
      - name: Fetch and filter recent papers
        run: python scripts/fetch_papers.py

      # Stage 2: visit each accepted paper's landing page and capture a genuine
      # graphical abstract / TOC image when the publisher exposes one. A lower-
      # confidence article image may be stored as a labelled fallback; generic
      # logos/placeholders are rejected by the enrichment script.
      - name: Enrich papers with TOC graphics
        run: python scripts/fetch_toc.py

      # Avoid creating empty daily commits when the generated dataset is
      # identical to the current papers.json file.
      - name: Commit updated dataset
        run: |
          if git diff --quiet papers.json; then
            echo "No literature changes to commit."
            exit 0
          fi

          # Use GitHub's standard automation identity for machine-made commits.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add papers.json
          git commit -m "Update literature dataset"
          git push
