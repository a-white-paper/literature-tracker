# Automatically refresh papers.json with recent literature from OpenAlex.
#
# This workflow is the scheduled data pipeline for the website. It first runs
# the synthetic-organic literature fetch/filter stage, then enriches accepted
# records with corresponding-author affiliations and Chinese translations,
# normalizes bilingual affiliation display, then resolves/validates TOC metadata.
# The completed papers.json dataset is committed only when it actually changes.

name: Update literature

on:
  # GitHub Actions cron schedules use UTC. 00:00 UTC corresponds to 08:00 in
  # China Standard Time (UTC+8).
  schedule:
    - cron: "0 0 * * *"

  # Re-run immediately whenever any data-pipeline script changes. This makes
  # code refinements visible on the website without waiting for the next daily
  # scheduled refresh.
  push:
    branches: ["main"]
    paths:
      - "scripts/fetch_papers.py"
      - "scripts/enrich_bilingual_metadata.py"
      - "scripts/normalize_affiliation_display.py"
      - "scripts/fetch_toc.py"
      - "scripts/validate_toc.py"
      - ".github/workflows/update-papers.yml"

  # Also allow the workflow to be started manually from the Actions tab.
  workflow_dispatch:

# The workflow needs write access because it may commit an updated papers.json
# back to the main branch.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # Download the current repository contents into the workflow runner.
      - name: Check out repository
        uses: actions/checkout@v4

      # Use a fixed Python version so scheduled runs are reproducible.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stage 1: query OpenAlex, apply the synthetic-organic admission and
      # materials-exclusion rules, normalize accepted papers, and deduplicate.
      - name: Fetch and filter recent papers
        run: python scripts/fetch_papers.py

      # Stage 2: prefer explicit corresponding-author metadata. If a source does
      # not identify the corresponding author, use the project convention of
      # treating the final listed author as corresponding and resolve that
      # author's institution through paper-level or author-profile metadata.
      - name: Enrich bilingual card metadata
        run: python scripts/enrich_bilingual_metadata.py

      # Stage 3: enforce the display convention requested for Chinese cards:
      # institution first, country second (``机构，国家``). This final guard also
      # cleans historical translation-cache entries such as ``美国莱斯大学``.
      - name: Normalize affiliation display
        run: python scripts/normalize_affiliation_display.py

      # Stage 4: inspect publisher/article metadata for possible graphical
      # abstracts. Candidate images are validated separately before display.
      - name: Enrich papers with TOC metadata
        run: python scripts/fetch_toc.py

      # Stage 5: enforce a strict display policy. Only images explicitly
      # identified as a graphical abstract / TOC are retained. Generic
      # PubMed/PMC/NLM preview images and ordinary article/social images are
      # removed so a misleading picture can never be shown as a TOC.
      - name: Validate TOC graphics
        run: python scripts/validate_toc.py

      # Avoid creating empty daily commits when the generated dataset is
      # identical to the current papers.json file.
      - name: Commit updated dataset
        run: |
          if git diff --quiet papers.json; then
            echo "No literature changes to commit."
            exit 0
          fi

          # Use GitHub's standard automation identity for machine-made commits.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add papers.json
          git commit -m "Update literature dataset"
          git push
